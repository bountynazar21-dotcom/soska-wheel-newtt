<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Soska Bar – Колесо фортуни</title>

  <link rel="stylesheet" href="style.css?v=45" />
</head>

<body>
  <div class="app">
    <h1 class="brand">Soska Bar</h1>

    <div class="wheel-wrap">
      <div class="wheel-container">
        <img id="wheel" src="assets/wheel.png?v=45" alt="Wheel" />

        <div id="pointer-rotator" class="pointer-rotator">
          <img
            src="assets/pointer.svg?v=45"
            alt="Pointer"
            class="pointer"
          />
        </div>
      </div>
    </div>

    <button id="spinBtn" class="spin-btn">🎡 Крутити</button>

    <p id="result" class="result result-default"></p>
  </div>

  <div id="fireworks" class="fireworks">
    <div id="fireworks-text"></div>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="wheel.js?v=45"></script>
</body>
</html>
